image: node:22

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

install:
  stage: build
  script:
    - npm ci

pages:
  stage: deploy
  script:
    - npm run build
    # Build Storybook to a directory outside public first to avoid circular copy error
    - npm run build-storybook -- -o storybook-static
    # Assuming Astro builds to dist/, copy it to public/ for GitLab Pages
    - cp -r dist/* public/
    # Move Storybook assets into public/storybook/
    - mkdir -p public/storybook
    - cp -r storybook-static/* public/storybook/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"