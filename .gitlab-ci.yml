image: node:22-slim  # ← smaller image, faster pull

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  CACHE_COMPRESSION_LEVEL: "fastest"  # ← also cache this
  npm_config_cache: "$CI_PROJECT_DIR/.npm"  # ← deterministic cache path

# ── Reusable cache template ──────────────────────────────────────────
.npm_cache: &npm_cache
  cache:
    key:
      files:
        - package-lock.json       # ← cache busts only when deps change
    paths:
      - .npm/
      - node_modules/
    policy: pull                  # jobs only read cache; seeder writes it

# ── Seed the cache once ──────────────────────────────────────────────
install_deps:
  stage: .pre                     # runs before all stages
  script:
    - npm ci --prefer-offline --no-audit
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: push                  # this job writes the cache

stages:
  - quality                       # lint + typecheck run IN PARALLEL here
  - build
  - test
  - deploy

lint_and_audit:
  stage: quality
  <<: *npm_cache
  script:
    - npm run format:check
    - npm run i18n:check
    - npx secretlint "**/*"
    - npm audit --omit=dev --audit-level=high

typecheck_and_deadcode:
  stage: quality                  # ← same stage = parallel execution
  <<: *npm_cache
  script:
    - npm run typecheck
    - npm run knip

build_app:
  stage: build
  needs: ["lint_and_audit", "typecheck_and_deadcode"]
  <<: *npm_cache
  variables:
    NODE_OPTIONS: "--max_old_space_size=4096"
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

build_storybook:
  stage: build
  needs: ["lint_and_audit", "typecheck_and_deadcode"]
  <<: *npm_cache
  variables:
    NODE_OPTIONS: "--max_old_space_size=4096"
  script:
    - npm run build-storybook -- -o public/storybook
  artifacts:
    paths:
      - public/storybook/
    expire_in: 1 day

lighthouse_ci:
  stage: test
  image: ghcr.io/puppeteer/puppeteer:latest  # ← Chromium pre-installed
  needs: ["build_app"]
  script:
    - npx --yes @lhci/cli autorun

pages:
  stage: deploy
  needs: ["build_app", "build_storybook", "lighthouse_ci"]
  script:
    - mkdir -p public
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
