image: node:22

variables:
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"

stages:
  - quality
  - typecheck
  - build
  - test
  - deploy

lint_and_audit:
  stage: quality
  script:
    - npm ci --prefer-offline --no-audit
    - npm run format:check
    - npm run i18n:check
    - npx secretlint "**/*"
    - npm audit --omit=dev --audit-level=high

typecheck_and_deadcode:
  stage: typecheck
  script:
    - npm ci --prefer-offline --no-audit
    - npm run typecheck
    - npm run knip

build_app:
  stage: build
  needs: ["lint_and_audit", "typecheck_and_deadcode"]
  variables:
    NODE_OPTIONS: "--max_old_space_size=4096"
  script:
    - npm ci --prefer-offline --no-audit
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

build_storybook:
  stage: build
  needs: ["lint_and_audit", "typecheck_and_deadcode"]
  variables:
    NODE_OPTIONS: "--max_old_space_size=4096"
  script:
    - npm ci --prefer-offline --no-audit
    - npm run build-storybook -- -o storybook-static
  artifacts:
    paths:
      - storybook-static/
    expire_in: 1 day

lighthouse_ci:
  stage: test
  needs: ["build_app"]
  before_script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_PATH=/usr/bin/chromium
  script:
    - npm ci --prefer-offline --no-audit
    - npx lhci autorun

pages:
  stage: deploy
  needs: ["build_app", "build_storybook", "lighthouse_ci"]
  script:
    - cp -r dist/* public/
    - mkdir -p public/storybook
    - cp -r storybook-static/* public/storybook/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
