image: node:22-slim

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

.npm_cache: &npm_cache
  cache:
    key:
      prefix: v4
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push

stages:
  - build_and_test
  - test_lighthouse
  - deploy

# ── Single Serial Job ────────────────────────────────────────────────
# All checks and builds run serially here to completely eliminate 
# cross-runner cache issues and avoid running npm ci multiple times.
validate_and_build:
  stage: build_and_test
  <<: *npm_cache
  variables:
    # Fixes the Out-Of-Memory crashes from earlier
    NODE_OPTIONS: "--max_old_space_size=4096"
  script:
    - npm ci --prefer-offline --no-audit
    
    # 1. Quality & Security
    - npm run format:check
    - npm run i18n:check
    - npx secretlint "**/*"
    - npm audit --omit=dev --audit-level=high
    
    # 2. Typecheck & Dead code
    - npm run typecheck
    - npm run knip
    
    # 3. Build Apps
    - npm run build
    - npm run build-storybook -- -o public/storybook
  artifacts:
    paths:
      - dist/
      - public/storybook/
    expire_in: 1 day

lighthouse_ci:
  stage: test_lighthouse
  needs: ["validate_and_build"]
  image: ghcr.io/puppeteer/puppeteer:latest
  script:
    - npx --yes @lhci/cli autorun

pages:
  stage: deploy
  needs: ["validate_and_build", "lighthouse_ci"]
  script:
    - mkdir -p public
    - cp -a dist/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
