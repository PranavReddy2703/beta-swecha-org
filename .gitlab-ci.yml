image: node:20

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

install:
  stage: build
  script:
    - npm ci

pages:
  stage: deploy
  script:
    - npm run build
    - npm run build-storybook -o public/storybook
    # Assuming Astro builds to dist/, copy it to public/ for GitLab Pages
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"