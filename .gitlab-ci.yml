image: node:22

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  ARTIFACT_COMPRESSION_LEVEL: "fastest"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  # Prevent git clean from crashing on Windows long paths inside .npm/ cache and permission issues on build artifacts
  GIT_CLEAN_FLAGS: -ffdx -e .npm/ -e dist/ -e storybook-static/

stages:
  - quality
  - typecheck
  - build
  - test
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/

lint_and_audit:
  stage: quality
  script:
    - npm ci --prefer-offline --no-audit
    - npm run format:check
    - npm run i18n:check
    - npx secretlint "**/*"
    - npm audit --omit=dev --audit-level=high

typecheck_and_deadcode:
  stage: typecheck
  script:
    - npm ci --prefer-offline --no-audit
    - npm run typecheck
    - npm run knip

build_assets:
  stage: build
  needs: ["lint_and_audit", "typecheck_and_deadcode"]
  script:
    - npm ci --prefer-offline --no-audit
    - npm run build
    - npm run build-storybook -- -o storybook-static
  artifacts:
    paths:
      - dist/
      - storybook-static/
    expire_in: 1 day

lighthouse_ci:
  stage: test
  needs: ["build_assets"]
  before_script:
    - apt-get update && apt-get install -y chromium
    - export CHROME_PATH=/usr/bin/chromium
  script:
    - npm ci --prefer-offline --no-audit
    - npx lhci autorun

pages:
  stage: deploy
  needs: ["build_assets", "lighthouse_ci"]
  script:
    - cp -r dist/* public/
    - mkdir -p public/storybook
    - cp -r storybook-static/* public/storybook/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
